# Horizon OS - CachyOS KDE Desktop Package Profile
profile:
  name: cachyos-kde
  description: "Complete KDE Plasma 6 desktop corresponding to CachyOS KDE profile with Horizon OS customization layer"
  target_arch: "x86_64"
  supports_x86_64_v3: true
  supports_x86_64_v4: true

repositories:
  cachyos:
    enabled: true
    priority: 1
    keyring: cachyos-keyring
    mirrorlists:
      - cachyos-mirrorlist
      - cachyos-v3-mirrorlist
      - cachyos-v4-mirrorlist
    repos:
      - cachyos-v3
      - cachyos-core-v3
      - cachyos-extra-v3
      - cachyos
  arch:
    core: true
    extra: true
    multilib: true

packages:
  base_system:
    - base
    - base-devel
    - linux-firmware
    - sudo
    - git
    - curl
    - wget
    - jq
    - vim
    - less
    - openssl
    - pciutils
    - usbutils
    - mkinitcpio

  cachyos_kernel_and_perf:
    - linux-cachyos
    - linux-cachyos-headers
    - cachyos-settings
    - cachyos-keyring
    - cachyos-mirrorlist
    - cachyos-v3-mirrorlist
    - ananicy-cpp
    - cachyos-ananicy-rules
    - scx-scheds

  bootloader_and_storage:
    - btrfs-progs
    - cryptsetup
    - dosfstools
    - e2fsprogs
    - efibootmgr
    - gptfdisk
    - parted
    - limine
    - snapper
    - snap-pac

  networking:
    - networkmanager
    - iwd
    - wpa_supplicant
    - wireless-regdb
    - avahi
    - nss-mdns

  audio_and_media:
    - pipewire
    - wireplumber
    - pipewire-audio
    - pipewire-pulse
    - pipewire-alsa
    - pipewire-jack
    - libpipewire
    - aubio

  display_manager:
    - sddm
    - sddm-kcm
    - qt6-5compat
    - qt6-declarative
    - qt6-svg

  kde_plasma_desktop:
    - plasma-desktop
    - plasma-workspace
    - kwin
    - kscreenlocker
    - powerdevil
    - systemsettings
    - kinfocenter
    - kmenuedit
    - polkit-kde-agent
    - xdg-desktop-portal-kde
    - kwallet-pam

  kde_applications:
    - dolphin
    - konsole
    - ark
    - spectacle
    - kate

  caelestia_runtime:
    - quickshell
    - matugen
    - qt6-base
    - qt6-declarative
    - qt6-multimedia
    - qt6-5compat
    - qt6-imageformats
    - qt6-svg
    - qt6-wayland
    - kwindowsystem
    - kguiaddons
    - networkmanager-qt
    - pulseaudio-qt
    - kglobalaccel
    - kconfig
    - kcoreaddons
    - libqalculate
    - libcava
    - cava
    - protobuf
    - libx11
    - wayland
    - ddcutil
    - brightnessctl
    - power-profiles-daemon

  fonts:
    - ttf-material-symbols-variable
    - ttf-rubik-vf
    - ttf-cascadia-code-nerd
    - noto-fonts
    - noto-fonts-cjk
    - noto-fonts-emoji

  hardware_acceleration:
    amd:
      - amd-ucode
      - vulkan-radeon
      - lib32-vulkan-radeon
      - mesa
      - lib32-mesa
    intel:
      - intel-ucode
      - vulkan-intel
      - lib32-vulkan-intel
      - intel-media-driver
      - mesa
      - lib32-mesa
    nvidia:
      - nvidia-open-dkms
      - nvidia-utils
      - lib32-nvidia-utils
      - nvidia-settings
      - egl-wayland
    vm:
      - xf86-video-vmware
      - qemu-guest-agent
      - spice-vdagent

horizon_components:
  sddm_theme:
    name: ryoku
    description: "Horizon Custom Orbital Clockwork theme"
    path: /usr/share/sddm/themes/ryoku
    config_file: /etc/sddm.conf.d/99-ryoku.conf
    upstream: "https://github.com/Ryoku-dev/ryoku-arch"
  splash_screen:
    name: Overload
    description: "Overload Plasma 6 Look-and-Feel splash screen"
    path: /usr/share/plasma/look-and-feel/Overload
    config_file: /etc/xdg/ksplashrc
    ocs_id: 2124799
  icon_theme:
    name: candy-icons
    description: "Candy Bar vibrant icon theme"
    path: /usr/share/icons/candy-icons
    config_file: /etc/xdg/kdeglobals
    ocs_id: 1305251
  caelestia_shell:
    name: caelestia-kde
    description: "Caelestia shell port for KDE Plasma 6"
    version: 2.6.3
    features:
      kwin_workspace_tracker: true
      autostart_service: true
      disable_sddm_theme_override: true
      disable_lockscreen_hijack: true
