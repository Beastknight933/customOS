#
# /etc/pacman.conf
# Horizon OS - Arch Linux + CachyOS Optimized Package Repositories
#

[options]
HoldPkg     = pacman glibc
Architecture = auto x86_64_v3
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# -------------------------------------------------------------
# CachyOS Repositories (CPU-Optimized v3/v4 Binaries)
# -------------------------------------------------------------
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist
Server = https://mirror.cachyos.org/repo/x86_64_v3/$repo

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist
Server = https://mirror.cachyos.org/repo/x86_64_v3/$repo

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist
Server = https://mirror.cachyos.org/repo/x86_64_v3/$repo

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist
Server = https://mirror.cachyos.org/repo/$arch/$repo

# -------------------------------------------------------------
# Standard Arch Linux Repositories
# -------------------------------------------------------------
[core]
Include = /etc/pacman.d/mirrorlist
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Include = /etc/pacman.d/mirrorlist
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[multilib]
Include = /etc/pacman.d/mirrorlist
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
